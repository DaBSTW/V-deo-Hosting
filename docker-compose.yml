# Despliegue de referencia en un VPS:  docker compose up -d --build
# Pon delante un reverse proxy (Caddy / Nginx) con TLS, o Cloudflare Tunnel.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dembed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: dembed
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Ajustes para una VPS pequeña (2 GB de RAM): PostgreSQL se mantiene por debajo de ~400 MB.
    # Si amplías la VPS, sube shared_buffers (~25 % de la RAM) y el límite del contenedor.
    command:
      - postgres
      - -c
      - shared_buffers=128MB          # caché propia de Postgres
      - -c
      - effective_cache_size=512MB    # cuánta caché del sistema puede suponer (no reserva memoria)
      - -c
      - work_mem=4MB                  # memoria por operación de orden/agrupación
      - -c
      - maintenance_work_mem=64MB     # VACUUM, índices, migraciones
      - -c
      - max_connections=30            # la web usa un pool pequeño; cada conexión cuesta memoria
    mem_limit: 512m                   # tope duro del contenedor (lo hace cumplir Docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dembed"]
      interval: 5s
      retries: 10

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dembed:${POSTGRES_PASSWORD:-change-me}@db:5432/dembed?schema=public
    volumes:
      # Documentos de identidad (cifrados). Inclúyelo en tus copias de seguridad.
      - kyc:/app/storage/kyc
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: { condition: service_healthy }

  # Solo necesario con VIDEO_PROVIDER=R2 y R2_HLS_ENABLED=true.
  hls-worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dembed:${POSTGRES_PASSWORD:-change-me}@db:5432/dembed?schema=public
    depends_on:
      db: { condition: service_healthy }
    profiles: ["hls"]

volumes:
  pgdata:
  kyc:
